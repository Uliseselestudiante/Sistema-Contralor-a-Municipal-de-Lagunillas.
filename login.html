<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso CML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="login.css">
    
    <!-- AÑADIDO: Favicon  -->
    <link rel="icon" href="Contraloria.ico">
</head>
<body>
    <!-- Contenedor de Notificaciones -->
    <div class="notification-container">
        <div id="successNotification" class="notification success">
            <i class="bi bi-check-circle-fill"></i>
            <span id="successMessage"></span>
        </div>
        <div id="errorNotification" class="notification error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorMessage"></span>
        </div>
    </div>

    <!-- Formulario de Login -->
    <div class="box" id="loginBox">
        <form id="loginForm" autocomplete="off">
            <div class="header-login">
                <img src="CML.png" alt="Logo CML" class="logo-login">
                <h2>BIENVENIDO</h2>
                <span class="subtitle">CONTRALORÍA MUNICIPAL DE LAGUNILLAS</span>
            </div>
            
            <div class="inputBox">
                <select id="userType" required>
                    <option value="" disabled selected>Tipo de Usuario</option>
                    <option value="admin">Administrador</option>
                    <option value="user">Administradora</option>
                </select>
            </div>

            <div class="inputBox">
                <input type="text" id="username" placeholder="Usuario" required>
            </div>

            <div class="inputBox">
                <input type="password" id="password" placeholder="Contraseña" required>
                <span class="toggle-password" data-target="password">
                    <i class="bi bi-eye-slash"></i>
                </span>
            </div>

            <div class="links">
                <a href="#" id="showForgotPassword">¿Olvidaste tu contraseña?</a>
                <a href="#" id="showRegister">Regístrate</a>
            </div>

            <input type="submit" value="Iniciar Sesión">
        </form>
    </div>

    <!-- Formulario de Registro -->
    <div class="box hidden-form" id="registerBox">
        <span class="close-btn" id="closeRegister"><i class="bi bi-x-lg"></i></span>
        <form id="registerForm" autocomplete="off">
            <div class="header-login">
                <img src="CML.png" alt="Logo CML" class="logo-login">
                <h2>REGISTRO</h2>
                <span class="subtitle">CREA TU CUENTA</span>
            </div>

            <div class="inputBox">
                <select id="regUserType" required>
                    <option value="" disabled selected>Tipo de Usuario</option>
                    <option value="admin">Administrador</option>
                    <option value="user">Administradora</option>
                </select>
            </div>

            <div class="inputBox">
                <input type="text" id="regUsername" placeholder="Nombre de Usuario" required>
            </div>

            <div class="inputBox">
                <input type="password" id="regPassword" placeholder="Contraseña" required>
                <span class="toggle-password" data-target="regPassword">
                    <i class="bi bi-eye-slash"></i>
                </span>
            </div>

            <div class="inputBox">
                <input type="password" id="regConfirmPassword" placeholder="Confirmar Contraseña" required>
                <span class="toggle-password" data-target="regConfirmPassword">
                    <i class="bi bi-eye-slash"></i>
                </span>
            </div>

            <div class="links">
                <a href="#" id="backToLoginFromRegister">Volver al Inicio de Sesión</a>
            </div>

            <input type="submit" value="Registrar">
        </form>
    </div>

    <!-- Formulario de Recuperación -->
    <div class="box hidden-form" id="forgotPasswordBox">
        <span class="close-btn" id="closeForgotPassword"><i class="bi bi-x-lg"></i></span>
        <form id="forgotPasswordForm" autocomplete="off">
            <div class="header-login">
                <img src="CML.png" alt="Logo CML" class="logo-login">
                <h2>RECUPERAR CONTRASEÑA</h2>
                <span class="subtitle">RESTABLECE TU ACCESO</span>
            </div>

            <div class="inputBox">
                <select id="forgotUserType" required>
                    <option value="" disabled selected>Tipo de Usuario</option>
                    <option value="admin">Administrador</option>
                    <option value="user">Administradora</option>
                </select>
            </div>

            <div class="inputBox">
                <input type="text" id="forgotUsername" placeholder="Usuario" required>
            </div>

            <div class="inputBox">
                <input type="password" id="newPassword" placeholder="Nueva Contraseña" required>
                <span class="toggle-password" data-target="newPassword">
                    <i class="bi bi-eye-slash"></i>
                </span>
            </div>

            <div class="inputBox">
                <input type="password" id="confirmNewPassword" placeholder="Confirmar Nueva Contraseña" required>
                <span class="toggle-password" data-target="confirmNewPassword">
                    <i class="bi bi-eye-slash"></i>
                </span>
            </div>

            <div class="links">
                <a href="#" id="backToLoginFromForgot">Volver al Inicio de Sesión</a>
            </div>

            <input type="submit" value="Actualizar Contraseña">
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
