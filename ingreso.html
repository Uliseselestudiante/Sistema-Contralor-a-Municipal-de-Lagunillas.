<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Control de Documentación - CML</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  
  <!-- AÑADIDO: Favicon  -->
  <link rel="icon" href="Contraloria.ico">
</head>
<body>

<!-- MODIFICADO: Header con posicionamiento absoluto para el perfil -->
<header class="site-header">
  <div class="header-inner">
    <img src="CML.png" alt="Logo CML" class="logo-img">
    <div class="site-title-wrapper">
        <div class="site-title">
            SISTEMA DE CONTROL DE DOCUMENTACIÓN<br>
            <span class="subtitle">CONTRALORÍA MUNICIPAL DE LAGUNILLAS</span>
        </div>
    </div>
  </div>
  
  <!-- NUEVO: Perfil de usuario posicionado de forma absoluta -->
  <div class="user-profile">
    <div class="user-avatar">
      <i class="bi bi-person-circle"></i>
    </div>
    <div class="user-details">
      <span class="user-name" id="active-username-display">Cargando...</span>
      <span class="user-role" id="active-user-role-display">Administrador</span>
    </div>
    <button class="btn-logout" id="logout-btn" title="Cerrar Sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar">
    <ul>
      <li class="active"><button id="btn-ingreso"><span class="icon">🔑</span><span class="label">Ingreso</span></button></li>
      <li><button id="btn-contralor"><span class="icon">👤</span><span class="label">Contralor Municipal</span></button></li>
      <li><button id="btn-direccion-general"><span class="icon">🏛️</span><span class="label">Dirección General</span></button></li>
      <li><button id="btn-auditoria"><span class="icon">🔍</span><span class="label">Auditoría Interna</span></button></li>
      <li><button id="btn-despacho"><span class="icon">📬</span><span class="label">Dirección de Despacho</span></button></li>
      <li><button id="btn-juridica"><span class="icon">⚖️</span><span class="label">Consultoría Jurídica</span></button></li>
      <li><button id="btn-talento"><span class="icon">👥</span><span class="label">Dirección de Talento Humano</span></button></li>
      <li><button id="btn-finanzas"><span class="icon">💰</span><span class="label">Dirección de Administración y Finanzas</span></button></li>
      <li><button id="btn-relaciones"><span class="icon">🤝</span><span class="label">Dirección de Relaciones Institucionales y Corporativas</span></button></li>
      <li><button id="btn-atencion"><span class="icon">🗣️</span><span class="label">Dirección General de Atención al Ciudadano y Control Social</span></button></li>
      <li><button id="btn-obras"><span class="icon">🏗️</span><span class="label">Dirección de Control de Obras y Servicios Públicos</span></button></li>
      <li><button id="btn-investigativa"><span class="icon">🕵️</span><span class="label">Dirección de Potestad Investigativa</span></button></li>
      <li><button id="btn-responsabilidades"><span class="icon">📜</span><span class="label">Dirección de Determinación de Responsabilidades</span></button></li>
      <li><button id="btn-control-local"><span class="icon">🏛️</span><span class="label">Dirección de Control del Poder Público Municipal y demás Entidades Locales</span></button></li>
    </ul>
  </nav>

  <main class="main" id="main-content">
  </main>
</div>

<!-- Modal único para crear/editar carpetas -->
<div class="modal-overlay" id="modal-overlay" aria-hidden="true" style="display:none;">
  <div class="modal micro" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h4 id="modal-title">Crear carpeta</h4>
    <input id="cedula-input" type="text" placeholder="Cédula (ej: V-12345678)" maxlength="20" required />
    <input id="nombre-input" type="text" placeholder="Nombre completo" maxlength="100" required />
    <input id="cargo-input" type="text" placeholder="Cargo" maxlength="100" required />
    <input id="fecha-input" type="date" required />
    
    <div class="custom-select-wrapper">
      <select id="estatus-input" required>
        <option value="" disabled selected>Selecciona estatus</option>
        <option value="Activo" class="option-activo">Activo</option>
        <option value="Inactivo" class="option-inactivo">Inactivo</option>
        <option value="Jubilado" class="option-jubilado">Jubilado</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">Cancelar</button>
      <button class="btn primary" id="modal-ok">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal único para escanear documentos -->
<div class="modal-overlay" id="scan-modal-overlay" aria-hidden="true" style="display:none;">
  <div class="modal scan-modal" role="dialog" aria-modal="true" aria-labelledby="scan-modal-title">
    <h4 id="scan-modal-title">Escanear Documento</h4>
    <div class="drop-area" id="drop-area">
      <div class="drop-area-content">
        <div class="drop-icon">📄</div>
        <p>Arrastra y suelta imágenes aquí o</p>
        <button class="btn primary" id="select-files-btn">Seleccionar archivos</button>
        <p class="drop-hint">También puedes pegar imágenes con Ctrl+V</p>
        <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
      </div>
    </div>
    <div class="preview-area" id="preview-area" style="display:none;">
      <div class="preview-header">
        <h5>Vista previa:</h5>
        <div class="document-name-input">
          <label for="document-name">Nombre del documento:</label>
          <input type="text" id="document-name" placeholder="Nombre del documento" maxlength="100">
        </div>
      </div>
      <div class="preview-container" id="preview-container"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="scan-modal-cancel">Cancelar</button>
      <button class="btn primary" id="scan-modal-save" disabled>Guardar</button>
    </div>
  </div>
</div>

<!-- Modal único para ver documento -->
<div class="modal-overlay" id="view-modal-overlay" aria-hidden="true" style="display:none;">
  <div class="modal view-modal" role="dialog" aria-modal="true" aria-labelledby="view-modal-title">
    <div class="view-modal-header">
      <h4 id="view-modal-title">Ver Documento</h4>
      <button class="btn ghost" id="view-modal-close">✕</button>
    </div>
    <div class="view-modal-body">
      <img id="document-view-image" src="" alt="Documento">
    </div>
  </div>
</div>

<nav id="context-menu" class="context-menu" style="display:none;" role="menu" aria-hidden="true">
  <ul>
    <li id="ctx-open" role="menuitem">Abrir</li>
    <li id="ctx-rename" role="menuitem">Editar</li>
    <li id="ctx-delete" role="menuitem">Eliminar</li>
  </ul>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
